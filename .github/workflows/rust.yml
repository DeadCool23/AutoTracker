name: Rust

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Build Rust
      working-directory: ./backend/api/src
      run: cargo build

    - name: Set up Docker
      uses: docker/setup-buildx-action@v2
    
    - name: Set up Java (for Allure)
      uses: actions/setup-java@v3
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Install Allure
      run: |
        ALLURE_VERSION=2.27.0
        wget https://github.com/allure-framework/allure2/releases/download/$ALLURE_VERSION/allure-$ALLURE_VERSION.zip
        unzip allure-$ALLURE_VERSION.zip -d $HOME/allure
        export PATH=$HOME/allure/allure-$ALLURE_VERSION/bin:$PATH
        allure --version
    
    - name: Setup env
      working-directory: ./backend
      run: |
        sed -i "s|PROJECT_ROOT=.*|PROJECT_ROOT=$GITHUB_WORKSPACE/backend|g" .env
        cat .env
    
    - name: Start Docker containers
      working-directory: ./backend
      run: |
        docker compose up -d redis postgres

    - name: Wait for PostgreSQL to be ready
      run: |
        for i in {1..30}; do
          if docker exec postgres pg_isready -U $POSTGRES_USER -d $POSTGRES_DB; then
            echo "PostgreSQL is ready!"
            break
          fi
          echo "Waiting for PostgreSQL... attempt $i"
          sleep 2
        done
        docker exec postgres pg_isready -U $POSTGRES_USER -d $POSTGRES_DB

    - name: Postgres data preparing
      working-directory: ./backend/db/sql_scripts/postgres
      run: |
        POSTGRES_USER=$(grep '^POSTGRES_USER=' ../../../.env | cut -d '=' -f2)
        POSTGRES_PASSWORD=$(grep '^POSTGRES_PASSWORD=' ../../../.env | cut -d '=' -f2)
        POSTGRES_DB=$(grep '^POSTGRES_DB=' ../../../.env | cut -d '=' -f2)
        
        echo "POSTGRES_USER: $POSTGRES_USER"
        echo "POSTGRES_DB: $POSTGRES_DB"
        
        for script in tables.sql constraints.sql procedure.sql functions.sql copy.sql; do
          if [ -f "$script" ]; then
            echo "Executing $script"
            docker exec -i postgres psql -h localhost -p 5432 -U $POSTGRES_USER -d $POSTGRES_DB < "$script"
          else
            echo "Warning: $script not found"
          fi
        done
    
    - name: Wait for ClickHouse to be ready
      run: |
        echo "Waiting for ClickHouse to be ready..."
        timeout 180s bash -c '
          while ! curl -s http://localhost:8123/ping >/dev/null; do
            sleep 3
            echo "ClickHouse is not ready yet..."
          done
        '
        echo "ClickHouse HTTP interface is ready!"
        
        timeout 120s bash -c '
          while ! docker exec clickhouse clickhouse-client -h localhost --query "SELECT 1" 2>/dev/null; do
            sleep 2
            echo "Waiting for ClickHouse native interface..."
          done
        '
        echo "ClickHouse native interface is ready!"

    - name: ClickHouse data preparing
      working-directory: ./backend/db/sql_scripts/clickhouse
      run: |
        CLICKHOUSE_USER=$(grep '^CLICKHOUSE_USER=' ../../../.env | cut -d '=' -f2)
        CLICKHOUSE_PASSWORD=$(grep '^CLICKHOUSE_PASSWORD=' ../../../.env | cut -d '=' -f2)
        CLICKHOUSE_DB=$(grep '^CLICKHOUSE_DB=' ../../../.env | cut -d '=' -f2)
        
        if [ -f "tables.sql" ]; then
          echo "Executing tables.sql for ClickHouse"
          # Используем host 'clickhouse' (имя контейнера) вместо localhost
          cat tables.sql | docker exec -i clickhouse clickhouse-client \
            -h localhost \
            -u "$CLICKHOUSE_USER" \
            --password "$CLICKHOUSE_PASSWORD" \
            --database "$CLICKHOUSE_DB" \
            --multiquery
        else
          echo "Warning: tables.sql not found for ClickHouse"
        fi
        
        docker exec clickhouse chmod +x /scripts/copy.sh
        docker exec clickhouse /scripts/copy.sh
    
    - name: Rust unit tests
      working-directory: ./backend/api
      run: make unit-test
    
    - name: Rust integration tests
      working-directory: ./backend/api
      run: make integration-test
    
    - name: Rust e2e tests
      working-directory: ./backend/api
      run: make e2e-test
    
    - name: Cache Allure report
      uses: actions/cache@v3
      with:
        path: ./backend/api/src/allure-report
        key: allure-report-${{ github.sha }}
        restore-keys: |
          allure-report-

    - name: Allure report
      working-directory: ./backend/api
      run: ./allure_report.sh

    - name: Deploy Allure report to GitHub Pages
      uses: peaceiris/actions-gh-pages@v3
      with:
        github_token: ${{ secrets.GITHUB_TOKEN }}
        publish_dir: ./backend/api/allure-report
        publish_branch: allure
        user_name: github-actions
        user_email: github-actions@github.com
