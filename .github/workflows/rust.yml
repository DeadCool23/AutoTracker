name: Rust CI/CD

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

env:
  CARGO_TERM_COLOR: always

jobs:
  setup:
    runs-on: ubuntu-latest
    outputs:
      postgres_user: ${{ steps.set-env.outputs.postgres_user }}
      postgres_db: ${{ steps.set-env.outputs.postgres_db }}
      clickhouse_user: ${{ steps.set-env.outputs.clickhouse_user }}
      clickhouse_db: ${{ steps.set-env.outputs.clickhouse_db }}
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Docker
      uses: docker/setup-buildx-action@v2
    
    - name: Load environment variables
      id: set-env
      run: |
        cd ./docker
        echo "postgres_user=$(grep '^POSTGRES_USER=' .env | cut -d '=' -f2)" >> $GITHUB_OUTPUT
        echo "postgres_db=$(grep '^POSTGRES_DB=' .env | cut -d '=' -f2)" >> $GITHUB_OUTPUT
        echo "clickhouse_user=$(grep '^CLICKHOUSE_USER=' .env | cut -d '=' -f2)" >> $GITHUB_OUTPUT
        echo "clickhouse_db=$(grep '^CLICKHOUSE_DB=' .env | cut -d '=' -f2)" >> $GITHUB_OUTPUT

  infrastructure:
    runs-on: ubuntu-latest
    needs: setup
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Docker
      uses: docker/setup-buildx-action@v2
    
    - name: Setup env
      working-directory: ./backend
      run: |
        sed -i "s|PROJECT_ROOT=.*|PROJECT_ROOT=$GITHUB_WORKSPACE/backend|g" .env
    
    - name: Start Docker containers
      working-directory: ./backend
      run: docker compose up -d

  postgres-setup:
    runs-on: ubuntu-latest
    needs: infrastructure
    steps:
    - uses: actions/checkout@v4
    
    - name: Wait for PostgreSQL
      run: |
        for i in {1..30}; do
          if docker exec postgres pg_isready -U ${{ needs.setup.outputs.postgres_user }} -d ${{ needs.setup.outputs.postgres_db }}; then
            echo "PostgreSQL is ready!"
            break
          fi
          sleep 2
        done
    
    - name: Prepare PostgreSQL data
      working-directory: ./backend/db/sql_scripts/postgres
      run: |
        for script in tables.sql constraints.sql procedure.sql functions.sql copy.sql; do
          if [ -f "$script" ]; then
            echo "Executing $script"
            docker exec -i postgres psql -h localhost -p 5432 -U ${{ needs.setup.outputs.postgres_user }} -d ${{ needs.setup.outputs.postgres_db }} < "$script"
          fi
        done

  clickhouse-setup:
    runs-on: ubuntu-latest
    needs: infrastructure
    steps:
    - uses: actions/checkout@v4
    
    - name: Wait for ClickHouse
      run: |
        timeout 120s bash -c '
          until curl -s http://localhost:8123/ping >/dev/null; do
            sleep 2
            echo "Waiting for ClickHouse..."
          done
        '
    
    - name: Prepare ClickHouse data
      working-directory: ./backend/db/sql_scripts/clickhouse
      run: |
        if [ -f "tables.sql" ]; then
          cat tables.sql | docker exec -i clickhouse clickhouse-client \
            -h localhost \
            -u ${{ needs.setup.outputs.clickhouse_user }} \
            --password "$(grep '^CLICKHOUSE_PASSWORD=' ../../../docker/.env | cut -d '=' -f2)" \
            --database ${{ needs.setup.outputs.clickhouse_db }} \
            --multiquery
        fi
        
        docker exec clickhouse chmod +x /scripts/copy.sh
        docker exec clickhouse /scripts/copy.sh

  build-and-test:
    runs-on: ubuntu-latest
    needs: [postgres-setup, clickhouse-setup]
    steps:
    - uses: actions/checkout@v4
    
    - name: Build Rust project
      working-directory: ./backend/api/src
      run: cargo build
    
    - name: Run Rust tests
      working-directory: ./backend/api/src
      run: cargo test --show-output
    
    - name: Stop containers
      if: always()
      working-directory: ./backend
      run: docker compose down
