name: Rust

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

env:
  CARGO_TERM_COLOR: always

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Check code formatting
      working-directory: ./backend/api
      run: make check-fmt

  complexity:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Check cyclomatic complexity
      working-directory: ./backend/api
      run: make check-cyclomatic
    - name: Check Halstead complexity
      working-directory: ./backend/api
      run: make check-halstead
    - name: Save detailed Halstead metrics
      uses: actions/upload-artifact@v4
      with:
        name: halstead_metrics
        path: ./backend/api/halstead_metrics.json
    
  test:
    runs-on: ubuntu-latest
    needs: 
      - format
      - complexity
    
    steps:
    - uses: actions/checkout@v4

    - name: Build Rust
      working-directory: ./backend/api/src
      run: cargo build

    - name: Set up Docker
      uses: docker/setup-buildx-action@v2
    
    - name: Set up Java (for Allure)
      uses: actions/setup-java@v3
      with:
        distribution: 'temurin'
        java-version: '17'
    
    - name: Install Allure
      run: |
        ALLURE_VERSION=2.27.0
        wget https://github.com/allure-framework/allure2/releases/download/$ALLURE_VERSION/allure-$ALLURE_VERSION.zip
        unzip allure-$ALLURE_VERSION.zip -d $HOME/allure
        export PATH=$HOME/allure/allure-2.27.0/bin:$PATH
        allure --version
    
    - name: Setup env
      working-directory: ./backend
      run: |
        sed -i "s|PROJECT_ROOT=.*|PROJECT_ROOT=$GITHUB_WORKSPACE/backend|g" .env
        cat .env
    
    - name: Start Docker containers
      working-directory: ./backend
      run: |
        docker compose up -d redis postgres-main

    - name: Wait for PostgreSQL to be ready
      run: |
        for i in {1..30}; do
          if docker exec postgres-main pg_isready -U $POSTGRES_USER -d $POSTGRES_DB; then
            echo "PostgreSQL is ready!"
            break
          fi
          echo "Waiting for PostgreSQL... attempt $i"
          sleep 2
        done
        docker exec postgres-main pg_isready -U $POSTGRES_USER -d $POSTGRES_DB

    - name: Postgres data preparing
      working-directory: ./backend/db/sql_scripts/postgres
      run: |
        POSTGRES_USER=$(grep '^POSTGRES_USER=' ../../../.env | cut -d '=' -f2)
        POSTGRES_PASSWORD=$(grep '^POSTGRES_PASSWORD=' ../../../.env | cut -d '=' -f2)
        POSTGRES_DB=$(grep '^POSTGRES_DB=' ../../../.env | cut -d '=' -f2)
        
        echo "POSTGRES_USER: $POSTGRES_USER"
        echo "POSTGRES_DB: $POSTGRES_DB"
        
        for script in tables.sql constraints.sql procedure.sql functions.sql copy.sql; do
          if [ -f "$script" ]; then
            echo "Executing $script"
            docker exec -i postgres-main psql -h localhost -p 5432 -U $POSTGRES_USER -d $POSTGRES_DB < "$script"
          else
            echo "Warning: $script not found"
          fi
        done
    
    - name: Restore Allure report cache
      uses: actions/cache@v3
      with:
        path: ./backend/api/allure-report
        key: allure-report-${{ github.ref_name }}-${{ github.run_number }}
        restore-keys: |
          allure-report-${{ github.ref_name }}-

    - name: Allure report
      working-directory: ./backend/api
      run: |
        export PATH=$HOME/allure/allure-2.27.0/bin:$PATH
        sudo apt-get update
        sudo apt-get install -y xmlstarlet
        cargo install cargo2junit

        make test-report
    
    - name: Save Allure report cache
      uses: actions/cache@v3
      with:
        path: ./backend/api/allure-report
        key: allure-report-${{ github.ref_name }}-${{ github.run_number }}
    
    - name: Upload Allure report
      uses: actions/upload-artifact@v4
      with:
        name: allure-report
        path: ./backend/api/allure-report
    
    - name: Rust unit tests
      working-directory: ./backend/api
      run: make unit-test
    
    - name: Rust integration tests
      working-directory: ./backend/api
      run: make integration-test
    
    - name: Rust e2e tests
      working-directory: ./backend/api
      run: make e2e-test


