[package]
name = "logger"
version = "0.1.0"
edition = "2024"

[dependencies]
chrono = "0.4"
chrono-tz = "0.10"

log = { version = "0.4.14", features = ["kv_unstable", "std"] }
env_logger = "0.11.8"

ansi_term = "0.12"

serde = { version = "1.0.219", features = ["derive"] }
tokio = { version = "1.47", features = ["full"] }
reqwest = { version = "0.11", features = ["json"] }

cfg = { path = "./../cfg" }
