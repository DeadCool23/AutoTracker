openapi: 3.1.0
info:
  title: AUTOTRACKER API
  description: API сервиса отслеживания марщрутов AutoTracker
  license:
    name: ''
  version: 0.1.0
servers:
  - url: http://127.0.0.1:9887
    description: Local server
  - url: http://{url}:9887
    description: Local network API
    variables:
      url:
        default: 0.0.0.0
        description: Default local network
paths:
  /camera/avg-speed:
    post:
      tags:
        - camera
      summary: Получение средней скорости
      description: Получение средней скорости автомобиля на конкретной камере
      operationId: handle_get_avg_speed_for_car_on_camera
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AvgSpeedRequest'
        required: true
      responses:
        '200':
          description: Средняя скорость успешно получена
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AvgSpeedResponse'
        '404':
          description: Средняя скорость не найдена
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AvgSpeedResponse'
              example:
                avg_speed: null
                status:
                  code: 4003
                  message: average speed not found
        '500':
          description: Внутренняя ошибка сервера
  /camera/by-location:
    post:
      tags:
        - camera
      summary: Получение камеры
      description: Получение камеры по координатам
      operationId: handle_get_camera_by_cords
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Location'
        required: true
      responses:
        '200':
          description: Камера успешно получена
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CameraResponse'
        '404':
          description: Камера не найдена
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CameraResponse'
              example:
                camera: null
                status:
                  code: 4002
                  message: camera not found
        '500':
          description: Внутренняя ошибка сервера
  /camera/{id}:
    get:
      tags:
        - camera
      summary: Получение камеры
      description: Получение камеры по id
      operationId: handle_get_camera_by_id
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: Камера успешно получена
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CameraResponse'
        '404':
          description: Камера не найдена
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CameraResponse'
              example:
                camera: null
                status:
                  code: 4002
                  message: camera not found
        '500':
          description: Внутренняя ошибка сервера
  /car/route:
    post:
      tags:
        - route
      summary: Получение маршрута
      description: Получение маршрута по гос.номеру и дате
      operationId: handle_route
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RouteRequest'
        required: true
      responses:
        '200':
          description: Маршрут успешно получен
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RouteResponse'
        '500':
          description: Внутренняя ошибка сервера
  /car/search:
    post:
      tags:
        - search
        - car
      summary: Поиск автомобилей
      description: Поиск автомобилей по общим фильтрам
      operationId: handle_search_cars_by_filters
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SearchCarByFilterRequest'
        required: true
      responses:
        '200':
          description: Автомобили успешно найдены
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CarSearcherResponse'
        '500':
          description: Внутренняя ошибка сервера
  /car/search/by-fio:
    post:
      tags:
        - search
        - car
      summary: Поиск автомобиля
      description: Поиск автомобиля по ФИО владельца
      operationId: handle_search_car_by_fio
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SearchByFIORequest'
        required: true
      responses:
        '200':
          description: Автомобили успешно найдены
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CarSearcherResponse'
        '500':
          description: Внутренняя ошибка сервера
  /car/search/by-gos-num-mask:
    post:
      tags:
        - search
        - car
      summary: Поиск автомобиля
      description: Поиск автомобиля по маске гос.номера
      operationId: handle_search_car_by_gos_num_mask
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SearchByGosNumRequest'
        required: true
      responses:
        '200':
          description: Автомобили успешно найдены
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CarSearcherResponse'
        '500':
          description: Внутренняя ошибка сервера
  /car/search/by-passport:
    post:
      tags:
        - search
        - car
      summary: Поиск автомобиля
      description: Поиск автомобиля по паспортным данным
      operationId: handle_search_car_by_passport
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SearchByPassportRequest'
        required: true
      responses:
        '200':
          description: Автомобили успешно найдены
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CarSearcherResponse'
        '500':
          description: Внутренняя ошибка сервера
  /snap/send:
    put:
      tags:
        - snap
      summary: Отравление снимка
      description: Отравление снимка автомобиля
      operationId: handle_snap_send
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SnapSendRequest'
        required: true
      responses:
        '201':
          description: Снимок успешно добавлен
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResponseWithoutData'
        '400':
          description: Некорректные входные параметры
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResponseWithoutData'
        '500':
          description: Внутренняя ошибка сервера
  /track-info/search:
    post:
      tags:
        - search
        - track-info
      summary: Поиск отслеживаний
      description: Поиск отслеживаний по общим фильтрам
      operationId: handle_search_track_info_by_filters
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SearchTrackInfoByFilterRequest'
        required: true
      responses:
        '200':
          description: Информация об отслеживании успешно найдена
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TrackInfoSearcherResponse'
        '500':
          description: Внутренняя ошибка сервера
  /track-info/search/by-date:
    post:
      tags:
        - search
        - track-info
      summary: Поиск отслеживаний
      description: Поиск отслеживаний по дате
      operationId: handle_search_track_info_by_date
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SearchByDateRequest'
        required: true
      responses:
        '200':
          description: Информация об отслеживании успешно найдена
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TrackInfoSearcherResponse'
        '500':
          description: Внутренняя ошибка сервера
  /track-info/search/by-fio:
    post:
      tags:
        - search
        - track-info
      summary: Поиск отслеживаний
      description: Поиск отслеживаний по ФИО пользователя
      operationId: handle_search_track_info_by_fio
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SearchByFIORequest'
        required: true
      responses:
        '200':
          description: Информация об отслеживании успешно найдена
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TrackInfoSearcherResponse'
        '500':
          description: Внутренняя ошибка сервера
  /track-info/search/by-gos-num-mask:
    post:
      tags:
        - search
        - track-info
      summary: Поиск отслеживаний
      description: Поиск отслеживаний по маске гос.номера
      operationId: handle_search_track_info_by_gos_num_mask
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SearchByGosNumRequest'
        required: true
      responses:
        '200':
          description: Информация об отслеживании успешно найдена
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TrackInfoSearcherResponse'
        '500':
          description: Внутренняя ошибка сервера
  /track-info/search/by-passport:
    post:
      tags:
        - search
        - track-info
      summary: Поиск отслеживаний
      description: Поиск отслеживаний по паспортным данным
      operationId: handle_search_track_info_by_passport
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SearchByPassportRequest'
        required: true
      responses:
        '200':
          description: Информация об отслеживании успешно найдена
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TrackInfoSearcherResponse'
        '500':
          description: Внутренняя ошибка сервера
  /user/auth:
    post:
      tags:
        - auth
        - user
      summary: Аутентификация
      description: Аутентификация пользователя по логину и паролю
      operationId: handle_auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AuthRequest'
        required: true
      responses:
        '200':
          description: Пользователь успешно авторизирован
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '500':
          description: Внутренняя ошибка сервера
  /user/passport-confirm:
    post:
      tags:
        - auth
        - user
      summary: Подтверждениее пасспортных данных
      description: Подтверждениее пасспортных данных пользователя
      operationId: handle_passport_conf
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PassportConfRequest'
        required: true
      responses:
        '200':
          description: Пользователь успешно обновил паспортные данные
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResponseWithoutData'
        '500':
          description: Внутренняя ошибка сервера
  /user/registr:
    post:
      tags:
        - auth
        - user
      summary: Регистрация
      description: Регистрация нового пользователя
      operationId: handle_reg
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegRequest'
        required: true
      responses:
        '200':
          description: Пользователь успешно зарегестрирован
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResponseWithoutData'
        '500':
          description: Внутренняя ошибка сервера
  /user/{login}:
    delete:
      tags:
        - user
      summary: Удвление пользователя
      description: Удаление пользователя по login
      operationId: handle_delete_user_by_login
      parameters:
        - name: login
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Пользователь успешно удален
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StatusResponse'
        '500':
          description: Внутренняя ошибка сервера
components:
  schemas:
    AuthRequest:
      type: object
      required:
        - email
        - pswd
      properties:
        email:
          type: string
          example: email@example.com
        pswd:
          type: string
          example: password
    AuthResponse:
      type: object
      required:
        - status
        - user
      properties:
        status:
          $ref: '#/components/schemas/StatusResponse'
        user:
          $ref: '#/components/schemas/User'
    AvgSpeedRequest:
      type: object
      required:
        - gos_num
        - location
      properties:
        gos_num:
          type: string
          example: О777ОО77
        location:
          $ref: '#/components/schemas/Location'
    AvgSpeedResponse:
      type: object
      required:
        - status
      properties:
        avg_speed:
          type:
            - number
            - 'null'
          format: double
          example: 70
        status:
          $ref: '#/components/schemas/StatusResponse'
    Camera:
      type: object
      required:
        - id
        - is_radar
        - location
      properties:
        id:
          type: integer
          example: 1
          minimum: 0
        is_radar:
          type: boolean
          example: true
        location:
          $ref: '#/components/schemas/Location'
    CameraResponse:
      type: object
      required:
        - status
        - camera
      properties:
        camera:
          $ref: '#/components/schemas/Camera'
        status:
          $ref: '#/components/schemas/StatusResponse'
    Car:
      type: object
      required:
        - owner_fio
        - gos_num
        - model
        - mark
        - color
        - year
        - vin
        - sts
        - pts
      properties:
        color:
          type: string
        gos_num:
          type: string
        mark:
          type: string
        model:
          type: string
        owner_fio:
          type: array
          items: false
          prefixItems:
            - type: string
            - type: string
            - type:
                - string
                - 'null'
        pts:
          $ref: '#/components/schemas/Document'
        sts:
          $ref: '#/components/schemas/Document'
        vin:
          type: string
        year:
          type: integer
          format: int32
          minimum: 0
    CarSearcherResponse:
      type: object
      required:
        - status
        - cars
      properties:
        cars:
          type: array
          items:
            $ref: '#/components/schemas/Car'
          example: []
        status:
          $ref: '#/components/schemas/StatusResponse'
    Document:
      type: object
      required:
        - serial
        - number
      properties:
        number:
          type: string
          example: '111111'
        serial:
          type: string
          example: '1111'
    Location:
      type: object
      required:
        - longitude
        - latitude
      properties:
        latitude:
          type: number
          format: double
          example: 53.9333
        longitude:
          type: number
          format: double
          example: 53.9222
    PassportConfRequest:
      type: object
      required:
        - email
        - passport
      properties:
        email:
          type: string
          example: exist@exist.com
        passport:
          $ref: '#/components/schemas/Document'
    PointData:
      type: object
      required:
        - cords
      properties:
        cords:
          $ref: '#/components/schemas/Location'
        speed:
          type:
            - integer
            - 'null'
          format: int32
          example: 60
          minimum: 0
    RegRequest:
      type: object
      required:
        - firstname
        - surname
        - email
        - pswd
        - rep_pswd
      properties:
        email:
          type: string
          example: email@example.com
        firstname:
          type: string
          example: firstname
        lastname:
          type:
            - string
            - 'null'
          example: lastname
        pswd:
          type: string
          example: password
        rep_pswd:
          type: string
          example: password
        surname:
          type: string
          example: surname
    ResponseWithoutData:
      type: object
      required:
        - status
      properties:
        status:
          $ref: '#/components/schemas/StatusResponse'
    Role:
      type: string
      enum:
        - user
        - operator
        - audit
    RouteRequest:
      type: object
      required:
        - user_login
        - gos_num
        - date
      properties:
        date:
          type: string
          example: 01.01.2025
        gos_num:
          type: string
          example: А777МР77
        user_login:
          type: string
          example: example@example.com
    RouteResponse:
      type: object
      required:
        - status
      properties:
        route:
          type:
            - array
            - 'null'
          items:
            $ref: '#/components/schemas/PointData'
        status:
          $ref: '#/components/schemas/StatusResponse'
    SearchByDateRequest:
      type: object
      required:
        - date
      properties:
        date:
          type: string
          example: 01.01.2025
    SearchByFIORequest:
      type: object
      properties:
        lastname:
          type:
            - string
            - 'null'
          example: lastname
        name:
          type:
            - string
            - 'null'
          example: name
        surname:
          type:
            - string
            - 'null'
          example: surname
    SearchByGosNumRequest:
      type: object
      required:
        - gos_num
      properties:
        gos_num:
          type: string
          example: А*23**99
    SearchByPassportRequest:
      type: object
      required:
        - passport
      properties:
        passport:
          $ref: '#/components/schemas/Document'
    SearchCarByFilterRequest:
      type: object
      required:
        - passport
      properties:
        gos_num:
          type:
            - string
            - 'null'
          example: А*23**99
        lastname:
          type:
            - string
            - 'null'
          example: lastname
        name:
          type:
            - string
            - 'null'
          example: name
        passport:
          $ref: '#/components/schemas/Document'
        surname:
          type:
            - string
            - 'null'
          example: surname
    SearchTrackInfoByFilterRequest:
      type: object
      required:
        - passport
      properties:
        date:
          type:
            - string
            - 'null'
          example: 01.01.2025
        gos_num:
          type:
            - string
            - 'null'
          example: А*23**99
        lastname:
          type:
            - string
            - 'null'
          example: lastname
        name:
          type:
            - string
            - 'null'
          example: name
        passport:
          $ref: '#/components/schemas/Document'
        surname:
          type:
            - string
            - 'null'
          example: surname
    SnapSendRequest:
      type: object
      required:
        - time
        - date
        - gos_num
        - camera
      properties:
        camera:
          $ref: '#/components/schemas/Camera'
        date:
          type: string
          example: 01.01.2025
        gos_num:
          type: string
          example: А777МР77
        speed:
          type:
            - integer
            - 'null'
          format: int32
          example: 70
          minimum: 0
        time:
          type: string
          example: '8:10'
    StatusResponse:
      type: object
      required:
        - code
        - message
      properties:
        code:
          type: integer
          example: 0
        message:
          type: string
          example: OK
    TrackInfo:
      type: object
      required:
        - track_time
        - route_date
        - car
        - user
      properties:
        car:
          $ref: '#/components/schemas/Car'
        route_date:
          type: string
        track_time:
          type: string
        user:
          $ref: '#/components/schemas/User'
    TrackInfoSearcherResponse:
      type: object
      required:
        - status
        - track_info
      properties:
        status:
          $ref: '#/components/schemas/StatusResponse'
        track_info:
          type: array
          items:
            $ref: '#/components/schemas/TrackInfo'
          example: []
    User:
      type: object
      required:
        - name
        - surname
        - email
        - role
        - is_verified
      properties:
        email:
          type: string
          example: email@example.ru
        is_verified:
          type: boolean
          example: true
        lastname:
          type:
            - string
            - 'null'
          example: Ivanovich
        name:
          type: string
          example: Ivan
        passport:
          oneOf:
            - type: 'null'
            - $ref: '#/components/schemas/Document'
        role:
          $ref: '#/components/schemas/Role'
        surname:
          type: string
          example: Ivanov
tags:
  - name: route
    description: Получение маршрута
  - name: auth
    description: Авторизация
  - name: user
    description: Пользователь
  - name: snap
    description: Снимки
  - name: search
    description: Поисковик
  - name: car
    description: Автомобили
  - name: camera
    description: Камера
  - name: track-info
    description: Информация об отслеживании

