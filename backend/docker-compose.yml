version: '3.8'

services:
  # DB ============================================================================
  redis:
    image: redis:latest
    container_name: redis
    restart: always
    
    ports:
      - "6379:6379"
    networks:
      - autotracker-net

  postgres-main:
    image: postgres:latest
    container_name: postgres-main
    restart: always

    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5432:5432"
    volumes:
      - ./db/data:/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d ${POSTGRES_DB} -h localhost"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - autotracker-net

  postgres-master:
    image: bitnami/postgresql:latest
    container_name: postgres
    restart: always

    environment:
      POSTGRESQL_USERNAME: ${POSTGRES_USER}
      POSTGRESQL_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRESQL_DATABASE: ${POSTGRES_DB}
      
      POSTGRESQL_REPLICATION_MODE: master
      POSTGRESQL_REPLICATION_USER: repl_user
      POSTGRESQL_REPLICATION_PASSWORD: repl_pwd
      
      POSTGRESQL_PGCTLTIMEOUT: 600
      ALLOW_EMPTY_ROOT_PASSWORD: yes
    ports:
      - "5445:5432"
    volumes:
      - postgres_primary_data:/bitnami/postgresql
      - ./db/data:/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d ${POSTGRES_DB} -h localhost"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - autotracker-net
  
  postgres-replica:
    image: bitnami/postgresql:latest
    container_name: postgres-replica
    restart: always
    environment:
      POSTGRESQL_USERNAME: ${POSTGRES_USER}
      POSTGRESQL_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRESQL_DATABASE: ${POSTGRES_DB}

      POSTGRESQL_REPLICATION_MODE: slave
      POSTGRESQL_REPLICATION_USER: repl_user
      POSTGRESQL_REPLICATION_PASSWORD: repl_pwd
      
      POSTGRESQL_MASTER_HOST: postgres
      POSTGRESQL_MASTER_PORT_NUMBER: 5432
      
      POSTGRESQL_PGCTLTIMEOUT: 600
      ALLOW_EMPTY_ROOT_PASSWORD: yes
    depends_on:
      postgres-master:
        condition: service_healthy
    volumes:
      - postgres_replica_data:/bitnami/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d ${POSTGRES_DB} -h localhost"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - autotracker-net

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: pgadmin
    ports:
      - "9999:80"
    restart: always
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL:-admin@autotracker.com}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD:-1234}
      PGADMIN_CONFIG_SERVER_MODE: 'False'
    depends_on:
      postgres-master:
        condition: service_healthy
    volumes:
      - ./docker/data/pgadmin/servers.json:/pgadmin4/servers.json
    networks:
      - autotracker-net
  
  clickhouse:
    image: clickhouse/clickhouse-server:latest
    container_name: clickhouse
    restart: always
    ports:
      - "8123:8123"
      - "9000:9000"
      - "9009:9009"
    volumes:
      - ${PROJECT_ROOT}/db/data:/data
      - ${PROJECT_ROOT}/db/sql_scripts/clickhouse:/scripts
    environment:
      - CLICKHOUSE_DB=${CLICKHOUSE_DB}
      - CLICKHOUSE_USER=${CLICKHOUSE_USER}
      - CLICKHOUSE_PASSWORD=${CLICKHOUSE_PASSWORD}
      - CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT=1
    networks:
      - autotracker-net
  
  # Testing ============================================================================
  test-container:
    build:
      context: .
      dockerfile: ./docker/test.Dockerfile
    environment:
      - TEST_PASSWORD=Krd!G0RW&
    container_name: test-container
    volumes:
      - "./allure-report:/app/api/allure-report"
  
  # API ============================================================================
  autotracker-api:
    build:
      context: .
      dockerfile: ./docker/api.Dockerfile
    container_name: autotracker-api
    restart: always
    environment:
      - POSTGRES_HOST=postgres-master
      - CLICKHOUSE_HOST=clickhouse
      - REDIS_HOST=redis
      - LOKI_HOST=loki
      - LOKI_APP_TAG=main
    ports:
      - "9090:9887"
    volumes:
      - "./logs:/app/logs"
    depends_on:
      - postgres-master
      - clickhouse
      - redis
      - loki
    networks:
      - autotracker-net

  autotracker-api-copy1:
    build:
      context: .
      dockerfile: ./docker/api.Dockerfile
    container_name: autotracker-api-copy1
    restart: always
    environment:
      - POSTGRES_HOST=postgres-replica
      - CLICKHOUSE_HOST=clickhouse
      - REDIS_HOST=redis
      - LOKI_HOST=loki
      - LOKI_APP_TAG=copy1
    ports:
      - "9191:9887"
    volumes:
      - "./logs_c1:/app/logs"
    depends_on:
      - postgres-replica
      - clickhouse
      - redis
      - loki
    networks:
      - autotracker-net
  
  autotracker-api-copy2:
    build:
      context: .
      dockerfile: ./docker/api.Dockerfile
    container_name: autotracker-api-copy2
    restart: always
    environment:
      - POSTGRES_HOST=postgres-replica
      - CLICKHOUSE_HOST=clickhouse
      - REDIS_HOST=redis
      - LOKI_HOST=loki
      - LOKI_APP_TAG=copy2
    ports:
      - "9292:9887"
    volumes:
      - "./logs_c2:/app/logs"
    depends_on:
      - postgres-replica
      - clickhouse
      - redis
      - loki
    networks:
      - autotracker-net
  
  autotracker-api-mirror:
    build:
      context: .
      dockerfile: ./docker/api.Dockerfile
    container_name: autotracker-api-mirror
    restart: always
    environment:
      - POSTGRES_HOST=postgres-replica
      - CLICKHOUSE_HOST=clickhouse
      - REDIS_HOST=redis
      - LOKI_HOST=loki
      - LOKI_APP_TAG=mirror
    ports:
      - "9797:9887"
    volumes:
      - "./logs_mirror:/app/logs"
    depends_on:
      - postgres-replica
      - clickhouse
      - redis
      - loki
    networks:
      - autotracker-net
  
  # Utils ============================================================================
  loki:
    image: grafana/loki:latest
    container_name: loki
    restart: always
    ports:
      - "3100:3100"
    command: -config.file=/etc/loki/loki-config.yaml
    volumes:
      - ./docker/data/loki/loki-config.yaml:/etc/loki/loki-config.yaml:ro
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:3100/ready"]
      interval: 15s
      timeout: 10s
      retries: 3
    networks:
      - autotracker-net

  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    restart: always
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_SERVER_ROOT_URL=http://localhost:3000/monitoring
      - GF_SERVER_SERVE_FROM_SUB_PATH=true
    depends_on:
      - loki
    volumes:
      - grafana-storage:/var/lib/grafana
    networks:
      - autotracker-net
  
  autotracker-nginx:
    container_name: autotracker-nginx
    image: nginx:alpine
    restart: always
    depends_on:
      - autotracker-api
      - autotracker-api-copy1
      - autotracker-api-copy2
      - autotracker-api-mirror
      - grafana
      - pgadmin
    ports:
      - "8181:8181"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf
      - ./../../AutoTracker:/AutoTracker
    networks:
      - autotracker-net

volumes:
  redis_data:
  postgres_primary_data:
  postgres_replica_data:
  clickhouse_data:
  grafana-storage:

networks:
  autotracker-net:
    driver: bridge
