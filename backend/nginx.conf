events {
    worker_connections 4600000;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    error_log /tmp/nginx_error.log debug;
    access_log /tmp/nginx_access.log;

    charset utf-8;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    server {
        listen 8181;
        server_name localhost;

        location ~ ^/api/(v\d+)/?$ {
            return 301 /api/$1/docs;
        }

        location /legacy {
            return 301 /api/v1/docs;
        }

        location /documentation {
            alias /AutoTracker/static/Readme.html;
            default_type text/html;
            
            add_header Content-Type "text/html; charset=utf-8" always;
            add_header Content-Security-Policy "default-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:;";
        }

        location /managment {
            alias /AutoTracker/static/managment.html;
            default_type text/html;
            
            add_header Content-Type "text/html; charset=utf-8" always;
            add_header Content-Security-Policy "default-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:;";
        }

        location / {
            root /AutoTracker/static;
            try_files $uri $uri/ /index.html;
            
            location ~* \.html$ {
                add_header Content-Type "text/html; charset=utf-8" always;
            }
        }

        location /reserved {
            alias /AutoTracker/static/index.html;
            
            default_type text/html;
            
            add_header Content-Type "text/html; charset=utf-8" always;
            add_header Content-Security-Policy "default-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:;";
        }

        location /images/ {
            alias /AutoTracker/static/images/;
            try_files $uri $uri/ =404;
            expires 30d;
        }

        location = /status-text {
            stub_status;
        }

        location = /status {
            alias /AutoTracker/static/status/index.html;
            
            default_type text/html;
            
            add_header Content-Type "text/html; charset=utf-8" always;
            add_header Content-Security-Policy "default-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:;";
        }

        location /status-ui/ {
            alias /AutoTracker/static/status/;
            index index.html;
            try_files $uri $uri/ =404;
        }
        
        location /admin/ {
            proxy_pass http://pgadmin:80/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_set_header X-Script-Name /admin;
            proxy_set_header X-Forwarded-Prefix /admin;

            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;

            proxy_connect_timeout 300s;
            proxy_send_timeout 300s;
            proxy_read_timeout 300s;

            proxy_buffering off;
        }

        location /api/ {
            proxy_pass http://autotracker-api:9887;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}
