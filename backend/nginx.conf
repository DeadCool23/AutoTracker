events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    charset utf-8;

    server {
        listen 8080;
        server_name localhost;

        location ~ ^/api/(v\d+)$ {
            return 301 /api/$1/docs;
        }

        location /legacy {
            return 301 /api/v1/docs;
        }

        location /documentation {
            alias /home/nisu/Programs/AutoTracker/static/README.html;
            default_type text/html;
            
            add_header Content-Type "text/html; charset=utf-8" always;
            add_header Content-Security-Policy "default-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:;";
        }

        location /misc/ {
            alias /home/nisu/Programs/AutoTracker/misc/;
            try_files $uri $uri/ =404;
            expires 30d;
        }

        location / {
            proxy_pass http://127.0.0.1:9090;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}
