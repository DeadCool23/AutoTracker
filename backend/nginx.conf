events {
    worker_connections 60000;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    error_log /tmp/nginx_error.log debug;
    access_log /tmp/nginx_access.log;

    charset utf-8;

    gzip on;
    gzip_http_version 1.1;
    gzip_min_length 256;
    gzip_comp_level 5;
    gzip_types
        text/plain
        text/css
        application/javascript
        application/json
        application/xml
        text/html
        image/svg+xml;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    map $request_method $upstream_api {
        GET     backend_get;
        default backend_write;
    }

    map $request_uri $no_cache {
        ~^/api/       1;
        ~^/mirror/api/ 1;
        default       0;
    }

    upstream backend_get {
        server autotracker-api:9887 weight=2;
        server autotracker-api-copy1:9887 weight=1;
        server autotracker-api-copy2:9887 weight=1;
        keepalive 32;
    }

    upstream backend_write {
        server autotracker-api:9887;
        keepalive 32;
    }

    upstream backend_mirror {
        server autotracker-api-mirror:9887;
        keepalive 8;
    }
    
    upstream monitor {
        server grafana:3000;
    }

    proxy_cache_path /tmp/nginx_cache levels=1:2 keys_zone=static_cache:100m inactive=10m max_size=500m;

    server {
        listen 8181;
        server_name localhost;

        proxy_hide_header Server;
        add_header Server $hostname always;
        server_tokens off;


        location ~ ^/api/(v\d+)/?$ {
            return 301 /api/$1/docs;
        }

        location ~ ^/mirror/api/(v\d+)/?$ {
            return 301 /mirror/api/$1/docs/;
        }

        location /legacy {
            return 301 /api/v1/docs;
        }

        location /documentation {
            alias /AutoTracker/static/Readme.html;
            default_type text/html;
            
            add_header Content-Type "text/html; charset=utf-8" always;
            add_header Content-Security-Policy "default-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:;";
        }

        location /managment {
            alias /AutoTracker/static/managment.html;
            default_type text/html;
            
            add_header Content-Type "text/html; charset=utf-8" always;
            add_header Content-Security-Policy "default-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:;";
        }

        location /monitoring/ {
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Forwarded-Server $host;
            
            proxy_pass http://monitor;
            
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
        }

        location / {
            root /AutoTracker/static;
            try_files $uri $uri/ /index.html;
            
            location ~* \.html$ {
                add_header Content-Type "text/html; charset=utf-8" always;
            }
        }

        location /reserved {
            return 301 /;
        }

        location /images/ {
            alias /AutoTracker/static/images/;
            try_files $uri $uri/ =404;
            expires 30d;
        }

        location = /status-text {
            stub_status;
        }

        location = /status {
            alias /AutoTracker/static/status/index.html;
            
            default_type text/html;
            
            add_header Content-Type "text/html; charset=utf-8" always;
            add_header Content-Security-Policy "default-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:;";
        }
        
        location /admin/ {
            proxy_pass http://pgadmin:80/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_set_header X-Script-Name /admin;
            proxy_set_header X-Forwarded-Prefix /admin;

            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;

            proxy_connect_timeout 300s;
            proxy_send_timeout 300s;
            proxy_read_timeout 300s;

            proxy_buffering off;
        }

        location /api/ {
            limit_except GET HEAD OPTIONS {
                proxy_pass http://backend_write;
            }

            proxy_pass http://backend_get;
            
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_cache static_cache;
            proxy_cache_key "$scheme$host$request_uri$request_method";
            proxy_cache_valid 200 60s;
            proxy_cache_bypass $no_cache;
            proxy_no_cache $no_cache;
            
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            
            add_header 'Access-Control-Allow-Origin' '*' always;
            add_header 'Access-Control-Allow-Methods' 'GET, POST, PUT, DELETE, OPTIONS' always;
            add_header 'Access-Control-Allow-Headers' 'Authorization,Content-Type,Accept,Origin,User-Agent,DNT,Cache-Control,X-Mx-ReqToken,Keep-Alive,X-Requested-With,If-Modified-Since' always;
            
            if ($request_method = 'OPTIONS') {
                add_header 'Access-Control-Allow-Origin' '*';
                add_header 'Access-Control-Allow-Methods' 'GET, POST, PUT, DELETE, OPTIONS';
                add_header 'Access-Control-Allow-Headers' 'Authorization,Content-Type,Accept,Origin,User-Agent,DNT,Cache-Control,X-Mx-ReqToken,Keep-Alive,X-Requested-With,If-Modified-Since';
                add_header 'Access-Control-Max-Age' 1728000;
                add_header 'Content-Type' 'text/plain charset=UTF-8';
                add_header 'Content-Length' 0;
                return 204;
            }
        }

        location ~ ^/mirror/api/(v\d+)/?$ {
            return 301 /mirror/api/$1/docs/;
        }

        location /mirror/ {
            proxy_no_cache 1;
            
            proxy_pass http://backend_mirror/;

            proxy_cache static_cache;
            proxy_cache_key "$scheme$host$request_uri$request_method";
            proxy_cache_valid 200 60s;
            proxy_cache_bypass $no_cache;
            proxy_no_cache $no_cache;
            
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            
            add_header 'Access-Control-Allow-Origin' '*' always;
            add_header 'Access-Control-Allow-Methods' 'GET, POST, PUT, DELETE, OPTIONS' always;
            add_header 'Access-Control-Allow-Headers' 'Authorization,Content-Type,Accept,Origin,User-Agent,DNT,Cache-Control,X-Mx-ReqToken,Keep-Alive,X-Requested-With,If-Modified-Since' always;
            
            if ($request_method = 'OPTIONS') {
                add_header 'Access-Control-Allow-Origin' '*';
                add_header 'Access-Control-Allow-Methods' 'GET, POST, PUT, DELETE, OPTIONS';
                add_header 'Access-Control-Allow-Headers' 'Authorization,Content-Type,Accept,Origin,User-Agent,DNT,Cache-Control,X-Mx-ReqToken,Keep-Alive,X-Requested-With,If-Modified-Since';
                add_header 'Access-Control-Max-Age' 1728000;
                add_header 'Content-Type' 'text/plain charset=UTF-8';
                add_header 'Content-Length' 0;
                return 204;
            }
        }
    }
}