events {
    worker_connections 615535;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    error_log /tmp/nginx_error.log debug;
    access_log /tmp/nginx_access.log;

    charset utf-8;

    server {
        listen 8080;
        server_name localhost;

        location ~ ^/api/(v\d+)$ {
            return 301 /api/$1/docs;
        }

        location /legacy {
            return 301 /api/v1/docs;
        }

        location /documentation {
            alias /home/nisu/Programs/AutoTracker/static/Readme.html;
            default_type text/html;
            
            add_header Content-Type "text/html; charset=utf-8" always;
            add_header Content-Security-Policy "default-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:;";
        }

        location / {
            root /home/nisu/Programs/AutoTracker/static;
            try_files $uri $uri/ /index.html;
            
            location ~* \.html$ {
                add_header Content-Type "text/html; charset=utf-8" always;
            }
        }

        location /reserved/ {
            alias /home/nisu/Programs/AutoTracker/static/;
            try_files $uri $uri/ /index.html;
            
            location ~* \.html$ {
                add_header Content-Type "text/html; charset=utf-8" always;
            }
        }

        location /images/ {
            alias /home/nisu/Programs/AutoTracker/static/images/;
            try_files $uri $uri/ =404;
            expires 30d;
        }

        location = /status {
            stub_status;
        }

        location /api/ {
            proxy_pass http://127.0.0.1:9090;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}
