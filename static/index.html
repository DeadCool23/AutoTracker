<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AutoTracker</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: radial-gradient(1200px 600px at 10% 10%, rgba(96,165,250,0.06), transparent),
                        radial-gradient(800px 400px at 90% 90%, rgba(77, 77, 77, 0.03), transparent),
                        #1d1d1d;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        
        .container {
            text-align: center;
            background: linear-gradient(145deg, #434343, #3a3a3a);
            padding: 30px 50px;
            border-radius: 30px;
            box-shadow: 
                0 10px 25px rgba(0, 0, 0, 0.3),
                inset 0 1px 0 rgba(255, 255, 255, 0.1);
            max-width: 500px;
            width: 90%;
            border: 1px solid #5a5a5a;
            position: relative;
            overflow: hidden;
        }
        
        figure {
            margin: 0 0 20px 0;
            padding: 30px;
            border-radius: 20px;
        }
        
        img {
            width: 380px;
            height: auto;
            display: block;
            margin: 0 auto;
            filter: drop-shadow(0 5px 10px rgba(0, 0, 0, 0.3));
            transform: scale(1.1);
            transition: transform 0.3s ease;
        }
        
        img:hover {
            transform: scale(1.15);
        }
        
        .button {
            display: inline-block;
            padding: 18px 40px;
            background: linear-gradient(to bottom, #f1f1f1, #d9d9d9);
            color: #2d2d2d;
            text-decoration: none;
            border-radius: 20px;
            font-weight: bold;
            transition: all 0.3s ease;
            border: none;
            cursor: pointer;
            font-size: 20px;
            box-shadow: 
                0 5px 15px rgba(0, 0, 0, 0.2),
                inset 0 1px 0 rgba(255, 255, 255, 0.8);
            position: relative;
            overflow: hidden;
            letter-spacing: 0.5px;
        }
        
        .button::after {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.4), transparent);
            transition: left 0.5s ease;
        }
        
        .button:hover {
            background: linear-gradient(to bottom, #ffffff, #e6e6e6);
            box-shadow: 
                0 7px 20px rgba(0, 0, 0, 0.3),
                inset 0 1px 0 rgba(255, 255, 255, 0.9);
            transform: translateY(-2px);
        }
        
        .button:hover::after {
            left: 100%;
        }
        
        .button:active {
            transform: translateY(1px);
            box-shadow: 
                0 3px 10px rgba(0, 0, 0, 0.2),
                inset 0 1px 0 rgba(255, 255, 255, 0.8);
        }
        
        @media (max-width: 480px) {
            .container {
                padding: 40px 30px;
                border-radius: 25px;
            }
            
            figure {
                padding: 20px;
            }
            
            img {
                width: 280px;
                transform: scale(1);
            }
            
            img:hover {
                transform: scale(1.05);
            }
            
            .button {
                padding: 16px 32px;
                font-size: 18px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <figure>
            <img src="./images/autotracker_text_icon.svg" alt="AutoTracker Logo"/>
        </figure>
        <a href="/managment" class="button">Менеджмент страниц</a>
    </div>
</body>
</html>
